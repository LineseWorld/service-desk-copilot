# 官方语法： https://toml.io/en/v1.0.0
# python编写指导： https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
# python toml编写规范： https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
# uv如何使用toml https://docs.astral.sh/uv/guides/projects/

[project]
name = "service-desk-copilot"
version = "0.1.0"
description = "Enterprise service desk agent learning project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]",
    "openai>=3.31.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a running migrated PostgreSQL database",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "RUF",
]
allowed-confusables = ["，","："]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "service_desk"
module-root = "src"
